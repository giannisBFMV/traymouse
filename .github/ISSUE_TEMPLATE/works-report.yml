name: It works / doesn't work with my mouse
description: Report how Squeak does with a 🧪 untested mouse (or any problem)
title: "Report: "
body:
  - type: input
    id: model
    attributes:
      label: Mouse model
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options: ["Works: battery matches", "Shows a number, but it's wrong", "Shows ✕", "Something else"]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Details
      description: What Squeak shows vs. what the official app shows, and whether it's on the receiver or the cable.
