name: Mouse request
description: Ask for your wireless mouse to be supported
title: "Mouse request: "
labels: ["mouse request"]
body:
  - type: input
    id: model
    attributes:
      label: Mouse model
      placeholder: e.g. Pulsar X2 V2 Wireless
    validations:
      required: true
  - type: input
    id: ids
    attributes:
      label: Receiver ID (optional, but it helps a lot)
      description: Device Manager → your receiver → Properties → Details → Hardware Ids. Paste the line that looks like USB\VID_xxxx&PID_xxxx.
  - type: dropdown
    id: test
    attributes:
      label: Can you test a build?
      options: ["Yes", "No"]
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Does the brand have a web driver or official app? Links help.
